<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>תרומה — טורניר קיץ 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      background: #1a1a1a;
      color: #f5f5f5;
      min-height: 100dvh;
      line-height: 1.5;
      padding: 1.5rem 1rem 2rem;
    }

    main {
      max-width: 22rem;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .lead {
      color: #ccc;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    section {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #333;
    }

    section:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .donate-btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      color: #fff;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 1rem;
    }

    .donate-btn:hover,
    .donate-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .paybox-btn {
      background: #0066cc;
    }

    .paybox-btn:hover,
    .paybox-btn:focus-visible {
      background: #0052a3;
    }

    .bit-btn {
      background: #00a896;
    }

    .bit-btn:hover,
    .bit-btn:focus-visible {
      background: #008577;
    }

    .hint {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <main>
    <h1>תרומה</h1>
    <p class="lead">נשמח לתמיכה בתפעול האתר והטורניר</p>

    <section aria-labelledby="paybox-heading">
      <h2 id="paybox-heading">PayBox</h2>
      <a
        class="donate-btn paybox-btn"
        href="https://links.payboxapp.com/YQXzMoMq93b"
        target="_blank"
        rel="noopener noreferrer"
      >
        תרומה ב-PayBox
      </a>
    </section>

    <section aria-labelledby="bit-heading">
      <h2 id="bit-heading">bit</h2>
      <a
        class="donate-btn bit-btn"
        href="https://www.bitpay.co.il/app/me/8069B5AA-810B-BEBB-28BC-8910660065621C8A"
        target="_blank"
        rel="noopener noreferrer"
      >
        תרומה ב-bit
      </a>
      <p class="hint">מומלץ לפתוח מהנייד עם אפליקציית bit</p>
    </section>
  </main>
</body>
</html>
