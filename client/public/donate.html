<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>תתרום לקפה — טורניר קיץ 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Roboto:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      background: #1a1a1a;
      color: #f5f5f5;
      min-height: 100dvh;
      line-height: 1.5;
      padding: 1.5rem 1rem 2rem;
    }

    main {
      max-width: 22rem;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-family: 'Outfit', 'Roboto', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: #f5c842;
      letter-spacing: 0.02em;
    }

    .lead {
      color: #ccc;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    section {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #333;
    }

    section:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .provider-logo {
      display: block;
      width: auto;
      max-width: 9rem;
      max-height: 2.75rem;
      margin: 0 auto 1rem;
      object-fit: contain;
    }

    .provider-logo--paybox {
      max-width: 10rem;
      max-height: 3rem;
    }

    .donate-btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      color: #fff;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 1rem;
    }

    .donate-btn:hover,
    .donate-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .paybox-btn {
      background: #0066cc;
    }

    .paybox-btn:hover,
    .paybox-btn:focus-visible {
      background: #0052a3;
    }

    .bit-btn {
      background: #00a896;
    }

    .bit-btn:hover,
    .bit-btn:focus-visible {
      background: #008577;
    }

    .hint {
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: #aaa;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>תתרום לקפה ☕</h1>
    <p class="lead">תודה על התמיכה — בחרו bit או PayBox</p>

    <section aria-labelledby="bit-heading">
      <h2 id="bit-heading" class="visually-hidden">bit</h2>
      <img
        class="provider-logo"
        src="/donate-bit-logo.png"
        width="120"
        height="44"
        alt="bit"
      />
      <a
        class="donate-btn bit-btn"
        href="https://www.bitpay.co.il/app/me/8069B5AA-810B-BEBB-28BC-8910660065621C8A"
        target="_blank"
        rel="noopener noreferrer"
      >
        תרומה ב-bit
      </a>
    </section>

    <section aria-labelledby="paybox-heading">
      <h2 id="paybox-heading" class="visually-hidden">PayBox</h2>
      <img
        class="provider-logo provider-logo--paybox"
        src="/donate-paybox-logo.webp"
        width="140"
        height="48"
        alt="PayBox"
      />
      <a
        class="donate-btn paybox-btn"
        href="https://links.payboxapp.com/YQXzMoMq93b"
        target="_blank"
        rel="noopener noreferrer"
      >
        תרומה ב-PayBox
      </a>
    </section>

    <p class="hint">מומלץ לפתוח מהנייד עם אפליקציית bit או PayBox</p>
  </main>
</body>
</html>
