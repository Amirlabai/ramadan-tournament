services:
  - type: web
    name: ramadan-tournament-api
    env: node
    region: frankfurt  # or singapore for free tier
    plan: free
    buildCommand: npm install && node scripts/render-api-build.mjs
    startCommand: npm start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false  # Set manually in Render dashboard
      - key: ADMIN_USERNAME
        sync: false  # Set manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false  # Set manually in Render dashboard
      - key: WORLD_CUP_ENABLED
        value: "true"
      - key: WORLD_CUP_ONLY
        value: "true"
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: FOOTBALL_DATA_SEASON
        value: "2026"
      - key: PORT
        value: 10000  # Render's default port
