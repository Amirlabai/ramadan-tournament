services:
  - type: web
    name: ramadan-tournament-api
    env: node
    region: frankfurt  # or singapore for free tier
    # Persistent disk requires a paid plan (not available on free).
    # Blueprint may NOT auto-upgrade an existing free service — confirm in the
    # Render dashboard: plan, disk mount at /var/data/uploads, and UPLOADS_DISK_PATH
    # before relying on the prod 503 upload guard alone.
    plan: starter
    buildCommand: npm install && node scripts/render-api-build.mjs
    startCommand: npm start --workspace=server
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOADS_DISK_PATH
        value: /var/data/uploads
      - key: DATABASE_URL
        sync: false
      # Live season: set REDIS_URL. Off-season: unset REDIS_URL and set REDIS_OPTIONAL=1.
      - key: REDIS_URL
        sync: false
      - key: REDIS_OPTIONAL
        sync: false
      - key: JWT_SECRET
        sync: false  # Set manually in Render dashboard
      - key: ADMIN_USERNAME
        sync: false  # Set manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false  # Set manually in Render dashboard
      - key: WORLD_CUP_ENABLED
        value: "true"
      - key: WORLD_CUP_ONLY
        value: "false"
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: FOOTBALL_DATA_SEASON
        value: "2026"
      - key: PORT
        value: 10000  # Render's default port
