name: Sync Production Photos

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  sync-photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for git-auto-commit-action

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo requests python-dotenv

      - name: Run sync script
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: python sync_photos.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync production photos [skip ci]"
          file_pattern: 'server/uploads/players/*'
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
