name: Tournament Stats Tracker

on:
  schedule:
    # Jerusalem is UTC+3 (DST) / UTC+2 (standard). During Ramadan (March 2026) Jerusalem is UTC+2.
    # 20:00 Jerusalem = 18:00 UTC
    # 21:00 Jerusalem = 19:00 UTC
    # 22:00 Jerusalem = 20:00 UTC
    # 23:00 Jerusalem = 21:00 UTC
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  track-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Track stats and post news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI:    ${{ secrets.MONGODB_URI }}
        run: python generate_message.py
